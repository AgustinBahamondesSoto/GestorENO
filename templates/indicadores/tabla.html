<div class="col-md-6">
    <section class="card card-body p-4 h-100">
        <h2>
            {{ titulo }}
        </h2>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>
                            Grupo
                        </th>
                        <th>
                            Pacientes
                        </th>
                        <th>
                            Porcentaje
                        </th>
                    </tr>
                </thead>
                <tbody>
                    {% for fila in filas %}
                        <tr>
                            <td>
                                {{ fila.nombre }}
                            </td>
                            <td>
                                {{ fila.cantidad }}
                            </td>
                            <td>
                                {{ fila.porcentaje }}
                                %
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="3">
                                Sin datos para mostrar.
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</div>
