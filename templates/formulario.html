{% if form.non_field_errors %}
    <div class="alert alert-danger" role="alert">
        {{ form.non_field_errors }}
    </div>
{% endif %}
{% for field in form %}
    <div class="{% if horizontal %}col-sm-6 col-lg-2{% else %}mb-3{% endif %}">
        <label class="form-label" for="{{ field.id_for_label }}">
            {{ field.label }}
        </label>
        {{ field }}
        {% if field.help_text %}
            <div class="form-text">
                {{ field.help_text }}
            </div>
        {% endif %}
        {% if field.errors %}
            <div class="text-danger small" role="alert">
                {{ field.errors }}
            </div>
        {% endif %}
    </div>
{% endfor %}
