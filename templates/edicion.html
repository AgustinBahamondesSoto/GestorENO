{% extends 'base.html' %}

{% block content %}
    <p class="etiqueta">GESTIÓN DE REGISTROS</p>
    <h1>{{ titulo }}</h1>
    {% if ayuda %}
        <p>{{ ayuda }}</p>
    {% endif %}
    <section class="card card-body p-4 my-4">
        <form method="post">
            {% csrf_token %}
            {% include 'formulario.html' %}
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <button class="btn btn-primary" type="submit">Guardar</button>
                <a href="{% url volver %}">Cancelar</a>
            </div>
        </form>
    </section>
{% endblock %}
